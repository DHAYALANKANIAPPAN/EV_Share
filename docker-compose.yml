# Local Postgres and Redis for development:  docker compose up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: evshare
      POSTGRES_PASSWORD: evshare
      POSTGRES_DB: evshare
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: ["redisdata:/data"]

volumes:
  pgdata:
  redisdata:
