<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EV Share · find and share EV chargers</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<script>try{if(localStorage.getItem("ev_theme")==="dark"||(!localStorage.getItem("ev_theme")&&matchMedia("(prefers-color-scheme: dark)").matches))document.documentElement.classList.add("dark")}catch{}</script>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="/static/js/tailwind-config.js"></script>
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="bg-canvas text-ink min-h-screen">
<a href="#main" class="sr-only focus:not-sr-only focus:absolute focus:m-2 focus:p-2 panel">Skip to main content</a>
<header class="topbar border-b border-line sticky top-0 z-20">
  <div class="mx-auto max-w-7xl px-4 h-16 flex items-center gap-2">
    <a href="/" class="flex items-center gap-2 font-semibold text-lg mr-4"><i data-lucide="zap" class="size-5 text-accent"></i>EV Share</a>
    <nav id="nav" class="flex gap-1 flex-1 overflow-x-auto" aria-label="Main"></nav>
    <div id="user" class="flex items-center gap-1"></div>
  </div>
</header>
<main id="main" class="mx-auto max-w-7xl px-4 py-8"></main>
<div id="livebar" hidden class="fixed inset-x-0 bottom-0 z-30 border-t border-line bg-panel" style="padding-bottom:env(safe-area-inset-bottom,0px)" role="region" aria-label="Hub status"></div>
<div id="scrim" class="scrim"></div>
<aside id="drawer" class="drawer" aria-label="Reserve a charger" role="dialog" aria-modal="true"></aside>
<dialog id="dlg"></dialog>
<div id="toasts" class="fixed bottom-4 left-1/2 -translate-x-1/2 grid gap-2 z-50 w-[min(420px,92vw)]" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script type="module" src="/static/js/main.js"></script>
</body>
</html>
