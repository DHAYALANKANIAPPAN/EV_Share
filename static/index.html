<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EV Share · find and share EV chargers</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<script>try{if(localStorage.getItem("ev_theme")==="dark"||(!localStorage.getItem("ev_theme")&&matchMedia("(prefers-color-scheme: dark)").matches))document.documentElement.classList.add("dark")}catch{}</script>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>tailwind.config={darkMode:"class",theme:{extend:{fontFamily:{sans:["Geist","system-ui","sans-serif"]},colors:{canvas:"rgb(var(--canvas)/<alpha-value>)",panel:"rgb(var(--panel)/<alpha-value>)",line:"rgb(var(--line)/<alpha-value>)",ink:"rgb(var(--ink)/<alpha-value>)",mute:"rgb(var(--mute)/<alpha-value>)",accent:"rgb(var(--accent)/<alpha-value>)",onaccent:"rgb(var(--onaccent)/<alpha-value>)",danger:"rgb(var(--danger)/<alpha-value>)"}}}}</script>
<style>
:root{--canvas:250 250 250;--panel:255 255 255;--line:228 228 231;--ink:24 24 27;--mute:100 100 110;--accent:4 120 87;--onaccent:255 255 255;--danger:185 28 28}
.dark{--canvas:9 9 11;--panel:20 20 23;--line:42 42 48;--ink:244 244 245;--mute:161 161 170;--accent:52 211 153;--onaccent:4 30 20;--danger:248 113 113}
body{font-family:Geist,system-ui,sans-serif;line-height:1.55}
:focus-visible{outline:2px solid rgb(var(--accent));outline-offset:2px}
.panel{background:rgb(var(--panel));border:1px solid rgb(var(--line));border-radius:12px}
.dark .panel{box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:8px;font-weight:500;font-size:14px;border:1px solid rgb(var(--line));transition:border-color .15s,opacity .15s,transform .15s}
.btn:hover{border-color:rgb(var(--mute))}.btn:active{transform:translateY(1px)}.btn:disabled{opacity:.5;pointer-events:none}
.btn-primary{background:rgb(var(--accent));color:rgb(var(--onaccent));border-color:rgb(var(--accent))}.btn-primary:hover{opacity:.9;border-color:rgb(var(--accent))}
.btn-danger{color:rgb(var(--danger));border-color:rgb(var(--danger))}
.ibtn{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:8px;border:1px solid transparent;position:relative;color:rgb(var(--mute));transition:color .15s,border-color .15s}
.ibtn:hover{color:rgb(var(--ink));border-color:rgb(var(--line))}
[data-tip]:hover::after,[data-tip]:focus-visible::after{content:attr(data-tip);position:absolute;top:calc(100% + 4px);right:0;white-space:nowrap;background:rgb(var(--ink));color:rgb(var(--canvas));font-size:12px;padding:4px 8px;border-radius:6px;z-index:60}
.field{display:grid;gap:4px;font-size:14px;font-weight:500}.field input,.field select{min-height:44px;border:1px solid rgb(var(--line));border-radius:8px;background:rgb(var(--canvas));padding:0 12px;font-weight:400;color:rgb(var(--ink));width:100%}
.field input:hover,.field select:hover{border-color:rgb(var(--mute))}
.row{display:grid;grid-template-columns:1fr auto;gap:8px 16px;padding:16px;border-top:1px solid rgb(var(--line));transition:background-color .15s}
.row:first-child{border-top:0}.row:hover,.row[data-on="true"]{background:rgb(var(--canvas))}
.drawer{position:fixed;inset:0 0 0 auto;width:min(440px,100%);background:rgb(var(--panel));border-left:1px solid rgb(var(--line));z-index:40;transform:translateX(100%);opacity:0;transition:transform .2s cubic-bezier(.16,1,.3,1),opacity .2s;visibility:hidden}
.drawer[data-open="true"]{transform:none;opacity:1;visibility:visible}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}.scrim[data-open="true"]{opacity:1;pointer-events:auto}
dialog{border:1px solid rgb(var(--line));border-radius:12px;background:rgb(var(--panel));color:rgb(var(--ink));padding:24px;width:min(420px,92vw)}dialog::backdrop{background:rgba(0,0,0,.4)}
.sk{background:rgb(var(--line));border-radius:6px;animation:p 1.4s ease-in-out infinite}@keyframes p{50%{opacity:.5}}
.pin{cursor:pointer;transition:transform .15s;transform-box:fill-box;transform-origin:center}.pin:hover,.pin[data-on="true"]{transform:scale(1.25)}
@media (prefers-reduced-motion:reduce){*,::before,::after{transition:opacity .1s!important;animation:none!important;transform:none!important}}
</style>
</head>
<body class="bg-canvas text-ink min-h-screen">
<a href="#main" class="sr-only focus:not-sr-only focus:absolute focus:m-2 focus:p-2 panel">Skip to main content</a>
<header class="border-b border-line bg-panel sticky top-0 z-20">
  <div class="mx-auto max-w-7xl px-4 h-16 flex items-center gap-2">
    <a href="/" class="flex items-center gap-2 font-semibold text-lg mr-4"><i data-lucide="zap" class="size-5 text-accent"></i>EV Share</a>
    <nav id="nav" class="flex gap-1 flex-1" aria-label="Main"></nav>
    <div id="user" class="flex items-center gap-1"></div>
  </div>
</header>
<main id="main" class="mx-auto max-w-7xl px-4 py-8"></main>
<div id="scrim" class="scrim"></div>
<aside id="drawer" class="drawer" aria-label="Reserve a charger" role="dialog" aria-modal="true"></aside>
<dialog id="dlg"></dialog>
<div id="toasts" class="fixed bottom-4 left-1/2 -translate-x-1/2 grid gap-2 z-50 w-[min(420px,92vw)]" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script type="module" src="/static/js/main.js"></script>
</body>
</html>
