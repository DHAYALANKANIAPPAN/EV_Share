name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - name: Migrations apply cleanly and match the models (SQLite)
        run: |
          alembic upgrade head
          alembic check
  postgres:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16
        env: { POSTGRES_USER: evshare, POSTGRES_PASSWORD: evshare, POSTGRES_DB: evshare }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U evshare" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      EVSHARE_DATABASE_URL: postgresql://evshare:evshare@localhost:5432/evshare
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements-dev.txt -r requirements-postgres.txt
      - name: Migrations apply cleanly and match the models (Postgres)
        run: |
          alembic upgrade head
          alembic check
